# =============================================================================
# ShoppingCart CD — delivery on merge to master
# =============================================================================
# CD half of the per-service pattern (ADR-023) — a copy of products-cd.yml with
# only the ShoppingCart specifics changed. Builds an immutable SHA-tagged image,
# pushes to ACR via OIDC (no secret), then bumps .image.tag in the values file
# for Argo CD to reconcile. No helm/kubectl, no cluster credentials.
#
# CART SPECIFIC: the image repository is antkart/SHOPPINGCART, not antkart/cart —
# deploy/helm/values/cart.yaml sets image.name: shoppingcart. The image built,
# pushed, and tagged here MUST be antkart/shoppingcart (the chart's Products-style
# image path uses image.name when set). CD bumps .image.tag in cart.yaml.
#
# Loop prevention: the tag-bump commit only touches deploy/helm/values/**, which
# is NOT in this workflow's path filter, so it can never retrigger CD; CI is
# pull_request-only; and the commit carries [skip ci]. The push uses a PAT
# (CD_PUSH_TOKEN), whose pushes CAN trigger workflows, so the path filter — not
# the token — is the loop guard.
# =============================================================================

name: ShoppingCart CD

on:
  push:
    branches: [ master ]
    paths:
      - 'AK.ShoppingCart/**'
      - 'AK.BuildingBlocks/**'
      # Documentation-only changes inside a service folder (e.g. *.md) do NOT
      # trigger delivery. The negation must be LAST — later patterns win in
      # GitHub Actions path filters.
      - '!**/*.md'

permissions:
  id-token: write
  contents: write

concurrency:
  group: cart-cd
  cancel-in-progress: false

env:
  ACR_NAME: acrantkartdev
  REGISTRY: acrantkartdev.azurecr.io
  IMAGE_REPO: antkart/shoppingcart                              # NOT antkart/cart — image.name override in cart.yaml
  DOCKERFILE: AK.ShoppingCart/AK.ShoppingCart.API/Dockerfile
  VALUES_FILE: deploy/helm/values/cart.yaml                      # Argo CD watches this; .image.tag is the field CD updates

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t "$REGISTRY/$IMAGE_REPO:$TAG" \
            -t "$REGISTRY/$IMAGE_REPO:latest" \
            .

      - name: Push image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$REGISTRY/$IMAGE_REPO:$TAG"
          docker push "$REGISTRY/$IMAGE_REPO:latest"

  update-gitops:
    name: update-gitops
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          token: ${{ secrets.CD_PUSH_TOKEN }}

      - name: Bump image tag in values
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' "$VALUES_FILE"
          echo "----- updated $VALUES_FILE -----"
          yq '.image' "$VALUES_FILE"

      - name: Commit and push tag bump
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then
            echo "image tag already $TAG — nothing to commit"
            exit 0
          fi
          git commit -m "chore(cd): shoppingcart image -> $TAG [skip ci]"
          git push origin HEAD:master
