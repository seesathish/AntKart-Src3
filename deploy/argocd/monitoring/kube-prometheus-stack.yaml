# kube-prometheus-stack — Prometheus + Grafana for the cluster, delivered by Argo CD.
#
# Scoped to the dedicated `monitoring` AppProject (../appproject-monitoring.yaml), NOT
# the least-privilege `antkart` project — this stack needs cluster-scoped kinds the
# AntKart project deliberately forbids. Apply the project FIRST.
#
# It lives in deploy/argocd/monitoring/ (NOT applications/) on purpose: the six service
# Applications in applications/ are an either/or with applicationset-antkart.yaml
# ("never both" — identical names collide), and `kubectl apply -f applications/` applies
# the whole folder. This stack is OUTSIDE that choice — different project, different
# source repo, different chart — so it must not sit in that folder. Apply it explicitly:
#   kubectl apply -f deploy/argocd/monitoring/kube-prometheus-stack.yaml
#
# Like the AntKart Applications, this is applied manually by the operator (there is no
# automated: block) — it comes up OutOfSync and waits for a reviewed manual sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Pinned, never floated (no "*" / no "latest"): a floating version would let a
    # background chart bump change the cluster on the next reconcile with no review.
    # 88.0.1 is the current stable release (operator app v0.93.0; kubeVersion >=1.25,
    # satisfied by aks-antkart-dev). Bump deliberately in a reviewed commit.
    targetRevision: 88.0.1
    helm:
      # Everything is inline so Git is the single source of truth (GitOps has no --set
      # at sync time). The footprint is kept small on purpose: the cluster is 2x
      # Standard_D2s_v3, and an unbounded Prometheus would evict AntKart pods — so every
      # component below sets BOTH requests and limits.
      values: |
        # --- Alertmanager: DISABLED. No alert routing/receivers are configured yet, so
        # running it would only consume memory. Enable in a later PR when routing exists.
        alertmanager:
          enabled: false

        # --- Control-plane scrape targets: DISABLED because AKS runs a MANAGED control
        # plane. On AKS the control-plane components (etcd, scheduler, controller-manager,
        # kube-proxy, CoreDNS) are operated by Azure and are NOT reachable from the node
        # pool, so these targets would be permanently DOWN. By default the chart also
        # creates headless Services for them in the kube-system namespace — which the
        # scoped `monitoring` AppProject (correctly) forbids, so the sync failed with
        # "namespace kube-system is not permitted in project 'monitoring'". That failure
        # is only what SURFACED the problem; the reason to disable them is the managed
        # control plane, NOT the AppProject restriction. Widening the project to kube-system
        # would let this Application deploy anything into kube-system and is deliberately
        # avoided. kubeApiServer stays ENABLED — it is scraped via the `kubernetes` Service
        # in the default namespace, which works on AKS. Value names verified against chart
        # 88.0.1 (helm show values).
        kubeApiServer:
          enabled: true
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        coreDns:
          enabled: false

        # --- Prometheus ---
        prometheus:
          prometheusSpec:
            # 3-day retention on an EPHEMERAL emptyDir (no storageSpec => emptyDir). No
            # persistent volume is provisioned on these tight nodes; a pod restart loses
            # history, which is an acceptable trade for a demo/interview cluster.
            retention: 3d

            # --- Cross-namespace ServiceMonitor discovery (the AntKart scrape targets) ---
            # Prometheus runs HERE in `monitoring`; the AntKart ServiceMonitors live in the
            # `antkart` namespace. TWO chart defaults must be overridden or Prometheus runs
            # with ZERO targets while reporting perfectly healthy:
            #   1. serviceMonitorSelectorNilUsesHelmValues (chart default TRUE): with an
            #      empty serviceMonitorSelector, TRUE restricts discovery to ServiceMonitors
            #      carrying THIS Helm release's label — which the AntKart ones do not. Set
            #      FALSE so an empty selector means "select ALL ServiceMonitors" (no label
            #      required on our ServiceMonitors).
            #   2. serviceMonitorNamespaceSelector (chart default {} -> rendered nil -> the
            #      operator searches only Prometheus's OWN namespace). Point it at the
            #      `antkart` namespace via the built-in immutable label
            #      kubernetes.io/metadata.name (present on every namespace since k8s 1.22),
            #      so discovery crosses into `antkart`.
            # Value names verified against chart 88.0.1 (helm show values).
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: antkart

            resources:
              requests:
                cpu: 150m
                memory: 400Mi
              limits:
                cpu: 500m
                memory: 700Mi

        # --- Prometheus operator (and its short-lived admission-webhook patch Job) ---
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
          admissionWebhooks:
            patch:
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

        # --- Grafana ---
        grafana:
          enabled: true
          # NO persistence — dashboards/state live in an emptyDir and are recreated from
          # the provisioned config on restart. The stack's DEFAULT Kubernetes dashboards
          # (cluster/node/pod/workload views, from kube-state-metrics + node-exporter) are
          # provisioned from ConfigMaps on every start, so they survive a restart; only
          # ad-hoc, hand-saved dashboards would be lost. Keeps the footprint small, no PVC.
          persistence:
            enabled: false
          # Admin password is NOT in Git. The chart reads it from a Secret created out of
          # band (see docs/development/5-observability.md for the exact kubectl command):
          #   kubectl create secret generic grafana-admin -n monitoring \
          #     --from-literal=admin-user=admin --from-literal=admin-password='<password>'
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi

        # --- kube-state-metrics (subchart) ---
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        # --- node-exporter (subchart; a DaemonSet — one pod per node) ---
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # No automated block — synced manually, like the AntKart Applications.
    syncOptions:
      # Create the monitoring namespace on first sync.
      - CreateNamespace=true
      # REQUIRED, not optional: the CRDs in this chart (e.g. the Prometheus CRD) exceed
      # the 262144-byte limit that client-side apply's last-applied-configuration
      # annotation imposes, so a client-side apply fails with "Too long". Server-side
      # apply has no such annotation and is the supported way to install these CRDs.
      - ServerSideApply=true
