# =============================================================================
# AppProject: monitoring
# =============================================================================
# A SECOND, separate Argo CD project for the cluster monitoring stack
# (kube-prometheus-stack). It exists deliberately as its own project rather than
# by widening the `antkart` project (appproject-antkart.yaml).
#
# WHY a second project instead of relaxing the first:
#   The `antkart` project is intentionally least-privilege — its Applications may
#   ONLY pull from the AntKart repo, ONLY deploy into the `antkart` namespace, and
#   ONLY create NAMESPACED resources (clusterResourceWhitelist is empty). That is
#   what stops a mistyped or compromised AntKart Application from being repointed at
#   another repo, deploying into kube-system, or creating cluster-scoped RBAC/CRDs.
#   The monitoring stack legitimately needs the opposite: a different chart repo and
#   a handful of cluster-scoped kinds (CRDs, ClusterRoles, webhooks). Granting those
#   to the `antkart` project would hand every AntKart Application the power to create
#   cluster RBAC and CRDs — a large, permanent blast-radius increase for one stack's
#   needs. Keeping monitoring in its own project confines that privilege to the one
#   Application that requires it; the AntKart project stays tight.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  # Keep the project even if this manifest is ever pruned from a parent app.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster monitoring stack (kube-prometheus-stack — Prometheus, Grafana).

  # Two permitted sources: the upstream prometheus-community Helm repo (the chart)
  # and this repo (the Application manifest / any values kept in Git). Nothing else.
  sourceRepos:
    - https://prometheus-community.github.io/helm-charts
    - https://github.com/seesathish/AntKart-Src3.git

  # Only the in-cluster `monitoring` namespace is a permitted deploy target.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring

  # The stack genuinely needs a small, enumerated set of CLUSTER-SCOPED kinds. These
  # are listed EXPLICITLY by group + kind (never "*") so the project grants exactly
  # what kube-prometheus-stack installs and nothing more:
  #   * CustomResourceDefinition        — the Prometheus/ServiceMonitor/etc. CRDs.
  #   * ClusterRole / ClusterRoleBinding — Prometheus, the operator, node-exporter and
  #                                        kube-state-metrics read cluster-wide.
  #   * Namespace                        — created on first sync (CreateNamespace=true).
  #   * Validating/MutatingWebhookConfiguration — the operator's admission webhooks.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  # Inside its own `monitoring` namespace the stack creates many namespaced kinds
  # (Deployments, Services, ConfigMaps, Secrets, ServiceAccounts, Roles, the CRs).
  # Allow all namespaced kinds — the destination already confines them to `monitoring`.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
