{{- if .Values.serviceMonitor.enabled }}
# Tells the Prometheus operator to scrape this service's /metrics. Rendered only when
# serviceMonitor.enabled (every service enables it); requires the operator CRDs from the
# monitoring stack. Lives in the `antkart` namespace; Prometheus (in `monitoring`)
# discovers it cross-namespace via serviceMonitorNamespaceSelector — see the monitoring
# Application. The scraped port is referenced BY NAME, not number: the five REST services
# and the gateway use the main HTTP port; AK.Discount overrides to its "metrics" port so
# the HTTP/2-only gRPC port is never scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "antkart-service.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "antkart-service.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      {{- include "antkart-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitor.portName | default .Values.service.portName }}
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: http
{{- end }}
